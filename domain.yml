version: "3.1"

slots:
  spoken_language:
    type: text
    mappings:
      - type: from_llm
  current_location:
    type: text
    mappings:
      - type: from_llm
  destination_location:
    type: text
    mappings:
      - type: from_llm
  transit_mode:
    type: text
    mappings:
      - type: from_llm
  departure_time:
    type: text
    mappings:
      - type: from_entity
        entity: time
      
entities:
  - time
  
responses:
  utter_ask_spoken_language:
    - text: "placeholder"
      metadata:
        rephrase: True
        rephrase_prompt: |
          The following is a conversation with an AI assistant built with Rasa.
          The assistant can help the navigate between locations.
          The assistant is helpful, creative, clever, and very friendly.
          The assistant should greet the user and ask for the spoken language of the user.
          Context / previous conversation with the user:
          {{history}}
          {{current_input}}
          Suggested AI Response:

