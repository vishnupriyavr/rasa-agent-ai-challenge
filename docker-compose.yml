services:
  otel-collector:
    container_name: otel-collector
    image: otel/opentelemetry-collector-contrib:0.114.0
    restart: always
    command: ["--config=/etc/otel-collector-config.yaml", ""]
    volumes:
      - /Users/vishnupriyavr/Documents/rasa-agent-ai-challenge/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - 4317:4317
      - 13133:13133
    environment:
      - HONEYCOMB_API_KEY=${HONEYCOMB_API_KEY}
      - OTEL_RESOURCE_ATTRIBUTES=${OTEL_RESOURCE_ATTRIBUTES}

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "6831:6831/udp"
      - "14269:14269"
      - "4317"
#    healthcheck:
#      test: ["CMD", "curl", "http://localhost:14269"]
#      interval: 15s
#      timeout: 10s
#      retries: 5
#      start_period: 15s
    environment:
      - COLLECTOR_OTLP_ENABLED=true